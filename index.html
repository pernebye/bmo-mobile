<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runner">
<title>Runner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-256.png">
<link rel="icon" href="icon-256.png">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

<!-- Экран входа -->
<div class="login" id="login" hidden>
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 512 512" width="44" height="44">
        <path d="M128,152 L296,256 L128,360" stroke="currentColor" stroke-width="36" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
        <path d="M216,152 L384,256 L216,360" stroke="currentColor" stroke-width="44" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Runner</h1>
    <p class="login-hint">Введи код из Google Authenticator — он меняется каждые 30 секунд.</p>

    <input type="text" id="login-code" inputmode="numeric" autocomplete="one-time-code"
           placeholder="000000" maxlength="64">
    <button class="primary" id="login-submit">Войти</button>

    <button class="login-scan" id="login-scan" hidden>Отсканировать QR с ключом</button>
    <p class="login-note" id="login-note">Нет доступа к Authenticator? Отсканируй QR с ключом устройства или вставь его в то же поле.</p>

    <div class="scanner" id="scanner" hidden>
      <video id="scanner-video" playsinline muted></video>
      <button class="login-scan" id="scanner-cancel">Отмена</button>
    </div>
  </div>
</div>

<header class="topbar">
  <div class="topbar-title" id="screen-title">Проекты</div>
  <button class="topbar-btn" id="btn-reload" title="Обновить">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M20 11.5A8 8 0 1 1 17.3 6"/><path d="M20 4v5h-5"/>
    </svg>
  </button>
</header>

<main class="screens">
  <!-- Проекты -->
  <section class="screen active" data-screen="projects">
    <div class="search-row">
      <input type="search" id="project-search" placeholder="Поиск проекта" autocomplete="off">
    </div>
    <div class="chips" id="workspace-chips"></div>
    <div class="list" id="projects-list"></div>
  </section>

  <!-- Задачи -->
  <section class="screen" data-screen="tasks">
    <div class="chips" id="task-chips">
      <button class="chip active" data-scope="all">Все<span>0</span></button>
      <button class="chip" data-scope="today">Сегодня<span>0</span></button>
      <button class="chip" data-scope="week">Неделя<span>0</span></button>
      <button class="chip" data-scope="overdue">Просрочено<span>0</span></button>
      <button class="chip" data-scope="done">Выполненные<span>0</span></button>
    </div>
    <div class="list" id="tasks-list"></div>
  </section>

  <!-- Календарь -->
  <section class="screen" data-screen="calendar">
    <div class="cal-top">
      <button class="cal-month-btn" id="cal-month-btn"><span id="cal-month-title"></span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 10l5 5 5-5"/></svg>
      </button>
      <div class="cal-top-actions">
        <button class="cal-icon-btn" id="cal-prev">&#8249;</button>
        <button class="cal-icon-btn cal-today-btn" id="cal-today">Сегодня</button>
        <button class="cal-icon-btn" id="cal-next">&#8250;</button>
      </div>
    </div>
    <div class="cal-month" id="cal-month"></div>
    <div class="cal-agenda" id="cal-agenda"></div>
  </section>

  <!-- Сессии -->
  <section class="screen" data-screen="sessions">
    <div class="list" id="sessions-list"></div>
  </section>
</main>

<button class="fab" id="btn-add" aria-label="Добавить" hidden>
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<nav class="tabbar">
  <button class="tab active" data-target="projects">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="4.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="4.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="14.5" width="7" height="5" rx="1.6"/><rect x="13.5" y="14.5" width="7" height="5" rx="1.6"/></svg>
    <span>Проекты</span>
  </button>
  <button class="tab" data-target="tasks">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 6 9.5 9.5 6"/><path d="M4 16.5 6 18.5 9.5 15"/><path d="M12.5 7.5H20M12.5 16.5H20"/></svg>
    <span>Задачи<i class="tab-badge" id="tab-badge" hidden></i></span>
  </button>
  <button class="tab" data-target="calendar">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
    <span>Календарь</span>
  </button>
  <button class="tab" data-target="sessions">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5 9 11l-4.5 4.5"/><path d="M11.5 17.5H19"/></svg>
    <span>Сессии</span>
  </button>
</nav>

<!-- Подробности / создание -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-tabs" id="sheet-tabs">
    <button class="sheet-tab active" data-kind="task">Задача</button>
    <button class="sheet-tab" data-kind="event">Событие</button>
  </div>
  <div class="sheet-kind" id="sheet-kind" hidden></div>

  <input type="text" id="f-title" placeholder="Что сделать" autocomplete="off">

  <div class="f-row">
    <label class="f-field">Дата<input type="date" id="f-date"></label>
    <label class="f-field" id="f-time-field">Время<input type="time" id="f-time"></label>
    <label class="f-field" id="f-duration-field" data-only="event">Длительность
      <select id="f-duration">
        <option value="15">15 мин</option>
        <option value="30">30 мин</option>
        <option value="60" selected>1 час</option>
        <option value="90">1,5 часа</option>
        <option value="120">2 часа</option>
        <option value="180">3 часа</option>
      </select>
    </label>
  </div>
  <div class="quick-dates" id="quick-dates">
    <button data-due="0">Сегодня</button>
    <button data-due="1">Завтра</button>
    <button data-due="2">Послезавтра</button>
    <button data-due="7">Через неделю</button>
  </div>

  <label class="switch-row" data-only="event"><span>Весь день</span><input type="checkbox" id="f-allday"></label>

  <div class="f-row">
    <label class="f-field">Проект<select id="f-project"><option value="">Без проекта</option></select></label>
    <label class="f-field" data-only="event">Тип
      <select id="f-category">
        <option value="work">Работа</option>
        <option value="call">Созвон</option>
        <option value="personal">Личное</option>
        <option value="other">Другое</option>
      </select>
    </label>
  </div>

  <input type="text" id="f-location" placeholder="Где — ссылка или адрес" data-only="event" autocomplete="off">
  <label class="switch-row" data-only="task"><span>Важная</span><input type="checkbox" id="f-priority"></label>
  <textarea id="f-notes" rows="3" placeholder="Заметки"></textarea>

  <div class="sheet-actions">
    <button class="ghost" id="f-delete" hidden>Удалить</button>
    <button class="ghost" id="f-done" hidden>Выполнено</button>
    <button class="primary" id="f-save">Создать</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js?v=8"></script>
</body>
</html>
